name: Validate OpenShelf SPA

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "read/index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "content/library-index.json"
      - "content/featured-free.json"
      - "catalog-registry.json"
      - ".github/workflows/apply-ui-layer.yml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SPA, JavaScript, links and JSON
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          def check_js(source, label):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                  f.write(source)
                  name = f.name
              result = subprocess.run(["node", "--check", name], text=True, capture_output=True)
              Path(name).unlink(missing_ok=True)
              if result.returncode:
                  raise SystemExit(f"JavaScript syntax error in {label}:\n{result.stderr}")
              print(f"PASS JavaScript syntax: {label}")

          app = Path("index.html").read_text(encoding="utf-8")
          if '<link rel="stylesheet" href="./styles.css">' not in app:
              raise SystemExit("index.html must load styles.css")
          if '<script defer src="./app.js"></script>' not in app:
              raise SystemExit("index.html must load app.js")
          if 'href="./books/"' in app or 'href="./sources/"' in app:
              raise SystemExit("Found a broken legacy books/ or sources/ relative link")
          if re.search(r"<script[^>]*>\s*\[", app, re.IGNORECASE):
              raise SystemExit("Found a raw array expression inside an inline script")
          if not Path("styles.css").is_file():
              raise SystemExit("styles.css is missing")

          script = Path("app.js").read_text(encoding="utf-8")
          check_js(script, "app.js")
          check_js(Path("sw.js").read_text(encoding="utf-8"), "sw.js")

          css = Path("styles.css").read_text(encoding="utf-8")
          if css.count("{") != css.count("}"):
              raise SystemExit("styles.css contains an unmatched CSS brace")
          print("PASS CSS brace balance")

          html_ids = set(re.findall(r'\bid="([^"]+)"', app))
          script_refs = set(re.findall(r'\$\("([^"]+)"\)', script))
          script_refs.discard("reader-retry")  # Created dynamically in the reader error fallback.
          missing_ids = sorted(script_refs - html_ids)
          if missing_ids:
              raise SystemExit("app.js references missing HTML IDs: " + ", ".join(missing_ids))
          print("PASS app.js static element IDs")

          reader = Path("read/index.html").read_text(encoding="utf-8")
          for match in re.finditer(r"<script([^>]*)>([\s\S]*?)</script>", reader, re.IGNORECASE):
              attributes, body = match.groups()
              if "application/ld+json" not in attributes.lower() and body.strip():
                  check_js(body, "read/index.html inline script")

          for json_path in (Path("manifest.webmanifest"), Path("content/library-index.json"), Path("content/featured-free.json"), Path("catalog-registry.json")):
              json.loads(json_path.read_text(encoding="utf-8"))
              print(f"PASS JSON: {json_path}")

          sw = Path("sw.js").read_text(encoding="utf-8")
          for cached in ('"./index.html"', '"./styles.css"', '"./app.js"', '"./manifest.webmanifest"', '"./content/featured-free.json"'):
              if cached not in sw:
                  raise SystemExit(f"Service-worker install shell does not cache {cached}")
          print("PASS PWA shell includes the homepage, stylesheet, app script and manifest")
          PY

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Run desktop, offline and mobile browser smoke tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/openshelf-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/smoke.cjs
