name: Apply OpenShelf UI layer

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject UI assets into homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./kindle-theme.css">'
          js = '<script defer src="./kindle-tools.js"></script>'
          if css not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
          if js not in s:
              s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit UI layer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'UI layer already applied'
          else
            git commit -m 'Apply Kindle-inspired UI and on-demand tools'
            git push
          fi
