name: Rights or takedown request
description: Report a potentially incorrect or infringing OpenShelf catalogue entry.
title: "[Rights review]: "
labels: ["rights-review"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach the disputed book file. OpenShelf currently links to third-party sources and does not host those files.
  - type: input
    id: entry
    attributes:
      label: OpenShelf entry or source URL
    validations:
      required: true
  - type: textarea
    id: concern
    attributes:
      label: Rights concern or correction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Publicly share only information appropriate for an issue tracker. Do not post private personal data.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand this issue is public and will avoid including sensitive contact or personal information.
          required: true
